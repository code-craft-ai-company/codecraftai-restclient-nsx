[tool.poetry]
name = "codecraftai-restclient-nsx"
description = "Code Craft AI - NSX-T REST Client Package"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python",
    "automation",
    "ccai",
    "restclient",
    "nsx",
    "nsx-t",
    "vmware"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.32.5"
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", branch = "main" }
codecraftai-interfaces = { git = "https://github.com/automationmojo/codecraftai-interfaces.git", branch = "main" }
codecraftai-credentials = { git = "https://github.com/automationmojo/codecraftai-credentials.git", branch = "main" }
codecraftai-restclient-base = { git = "https://github.com/automationmojo/codecraftai-restclient-base.git", branch = "main" }

[tool.poetry.group.dev.dependencies]
hypothesis = ">=6.0.0"
pytest = ">=8.0.0"
requests-mock = ">=1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
